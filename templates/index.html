<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visión - JARVIS Interface</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            padding: 25px;
            box-sizing: border-box;
        }

        .face-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: auto;
            margin-bottom: auto;
            transition: all 0.4s ease;
        }

        .eyes {
            display: flex;
            gap: 50px;
            margin-bottom: 35px;
        }

        .eye {
            width: 45px;
            height: 45px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
            transition: transform 0.3s ease, background-color 0.4s ease;
        }

        @keyframes blink {
            0%, 96%, 100% { transform: scaleY(1); }
            98% { transform: scaleY(0.1); }
        }

        .face-container:not(.thinking):not(.happy) .eye {
            animation: blink 4s infinite;
        }

        .mouth {
            width: 90px;
            height: 12px;
            background-color: #38bdf8;
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
            transition: all 0.4s ease;
        }

        .thinking .eye {
            transform: scaleY(0.25);
            background-color: #facc15;
            box-shadow: 0 0 25px rgba(250, 204, 21, 0.7);
        }
        .thinking .mouth {
            width: 35px;
            height: 8px;
            border-radius: 50%;
            background-color: #facc15;
        }

        .happy .eye {
            transform: scale(1.15);
            background-color: #4ade80;
            box-shadow: 0 0 30px rgba(74, 222, 128, 0.8);
        }
        .happy .mouth {
            width: 110px;
            height: 24px;
            border-radius: 0 0 60px 60px;
            background-color: #4ade80;
        }

        #status-text {
            margin-top: 15px;
            font-size: 1.15rem;
            text-align: center;
            max-width: 90%;
            color: #94a3b8;
            min-height: 60px;
            line-height: 1.5;
        }

        .controls {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 450px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #1e293b;
            background-color: #0f172a;
            color: #f1f5f9;
            font-size: 1rem;
            outline: none;
        }

        button {
            padding: 14px 22px;
            border-radius: 12px;
            border: none;
            background-color: #0284c7;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="face-container" id="face">
        <div class="eyes">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <div class="mouth"></div>
    </div>

    <div id="status-text">Sistemas JARVIS en línea. ¿Qué orden deseas, señor?</div>

    <div class="controls">
        <input type="text" id="user-input" placeholder="Escribe a Visión..." autocomplete="off">
        <button onclick="enviarMensaje()">Enviar</button>
    </div>

    <!-- Reproductor de audio invisible para ElevenLabs -->
    <audio id="audio-player"></audio>

    <script>
        async function enviarMensaje() {
            const input = document.getElementById('user-input');
            const statusText = document.getElementById('status-text');
            const face = document.getElementById('face');
            const audioPlayer = document.getElementById('audio-player');
            
            const mensaje = input.value.trim();
            if (!mensaje) return;

            face.className = "face-container thinking";
            statusText.innerText = "Analizando...";
            input.value = "";

            try {
                const response = await fetch(`/hablar/${encodeURIComponent(mensaje)}`);
                const data = await response.json();

                if (data.status === "success") {
                    face.className = "face-container " + data.emocion;
                    statusText.innerText = data.respuesta;

                    // Reproduce el audio generado por ElevenLabs desde Flask
                    if (data.audio_url) {
                        audioPlayer.src = data.audio_url + "?t=" + new Date().getTime(); // Evita caché
                        audioPlayer.play().catch(e => console.log("Error al reproducir audio:", e));
                    }
                } else {
                    face.className = "face-container";
                    statusText.innerText = "Error: " + data.mensaje;
                }
            } catch (error) {
                face.className = "face-container";
                statusText.innerText = "Error de conexión con el servidor.";
            }
        }

        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                enviarMensaje();
            }
        });
    </script>
</body>
</html>
